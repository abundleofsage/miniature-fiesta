<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OutFront Youth Group - On Break</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #111827; /* bg-gray-900 */
            color: #E5E7EB; /* text-gray-200 */
            overflow-x: hidden; /* Important to prevent scrollbars from skewed elements */
        }
        .hero-bg {
            background: linear-gradient(45deg, #f87171, #fb923c, #facc15, #a3e635, #4ade80, #38bdf8, #818cf8, #d8b4fe);
            background-size: 400% 400%;
            animation: gradient-animation 15s ease infinite;
        }
        @keyframes gradient-animation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <main>
        <section class="hero-bg text-white relative text-center overflow-hidden h-screen flex items-center justify-center">
            <div class="container mx-auto px-6 py-32 md:py-48 relative z-10">
                <img src="outfront-logo.png" alt="OutFront Youth Group Logo" class="h-24 mx-auto mb-8">
                <h2 class="text-4xl md:text-7xl font-extrabold leading-tight drop-shadow-xl">We'll be back soon!</h2>
                <p class="mt-6 text-lg md:text-2xl max-w-3xl mx-auto drop-shadow-lg">
                    Thank you for being with us for all these years. We will be taking a short break to reorganize and be even better in 2026. Enjoy the holidays!
                </p>
            </div>
        </section>
    </main>

    <footer class="absolute bottom-0 left-0 right-0 py-8">
        <div class="container mx-auto px-6 text-center text-gray-200 flex flex-col sm:flex-row justify-center items-center space-y-4 sm:space-y-0 sm:space-x-8">
            <a href="https://www.socoequality.org/" target="_blank" rel="noopener noreferrer" class="transition-opacity hover:opacity-80">
              <img src="https://images.squarespace-cdn.com/content/v1/5b5776b2af20962f0511952c/e6e59ae4-1fb2-4679-8f03-4da69779a43c/SCEAlogo300dpiPRINT.png?format=1500w" alt="Southern Colorado Equality Alliance Logo" class="h-16 w-auto">
            </a>
            <a href="https://www.facebook.com/outfrontyouth" target="_blank" rel="noopener noreferrer" class="transition-opacity hover:opacity-80">
                <i data-lucide="facebook" class="h-8 w-8"></i>
            </a>
        </div>
    </footer>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
